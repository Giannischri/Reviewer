<div dir="rtl" class="search-bar" fxLayoutGap="20px" style="margin-bottom: 20px;">
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Project Search</mat-label>
    <input matInput placeholder="Search projects" />
    <button mat-icon-button matSuffix aria-label="Search projects">
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>
</div>

<div fxLayout="row wrap" fxLayoutGap="17px grid" fxLayoutAlign="start stretch">
  <div *ngFor="let post of posts" fxFlex="25%" fxFlex.sm="33%" fxFlex.xs="90%" style="min-width: 280px;">
    <mat-card class="card" style="display: flex; flex-direction: column; height: 100%;">
      <mat-card-header>
        <div fxLayout="row" fxLayoutAlign="center start" style="width: 100%;">
          <mat-card-title style="flex-grow: 1;">{{ post.title }}</mat-card-title>
          <mat-icon *ngIf="post.finalized" color="primary" aria-label="Finalized project">done_outline</mat-icon>
          <mat-icon *ngIf="!post.open" color="warn" aria-label="Locked project">lock</mat-icon>
        </div>
      </mat-card-header>

      <mat-card-subtitle>Manager: {{ post.managerId }}</mat-card-subtitle>

      <mat-card-content style="flex-grow: 1; overflow: hidden;">
        <p style="max-height: 80px; overflow: hidden; text-overflow: ellipsis;">
          {{ post.description }}
        </p>

        <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="start start" style="margin-top: 10px;">
          <button mat-button color="accent" aria-label="Show candidates">Candidates</button>
          <button mat-button color="primary" aria-label="Show rankers">Rankers</button>
        </div>
      </mat-card-content>

      <mat-card-actions fxLayout="row" fxLayoutAlign="space-between center" style="width: 100%;">
        <div fxLayout="column" fxLayoutAlign="center center" style="width: 100%;">
          <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="space-between center" style="width: 100%;">
            <button mat-raised-button color="primary" aria-label="View post" style="flex: 1; min-width: 0;">
              View <mat-icon>pageview</mat-icon>
            </button>

            <button mat-raised-button color="primary" aria-label="Edit post" style="flex: 1; min-width: 0;">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-raised-button color="primary"  aria-label="Rank post" style="flex: 1; min-width: 0;" (click)="openProjectRankingDialog()">Rank</button>

            <button mat-raised-button color="primary" aria-label="Export post data" style="flex: 1; min-width: 0;">
              <mat-icon>import_export</mat-icon>
            </button>
          </div>

          <div fxLayout="column" fxLayoutAlign="center center" style="margin-top: 10px; width: 100%;">
            <button mat-raised-button color="accent" aria-label="Become candidate">Become Candidate</button>
          </div>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
